version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: Ziva_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: Ziva_housing
      POSTGRES_USER: Ziva_user
      POSTGRES_PASSWORD: Ziva_pass_2024
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U Ziva_user -d Ziva_housing' ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: Ziva_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: Ziva_minio_admin
      MINIO_ROOT_PASSWORD: Ziva_minio_secret_2024
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live' ]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  minio_data:
